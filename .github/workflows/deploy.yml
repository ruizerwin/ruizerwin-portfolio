name: Deploy Portfolio

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deployment target
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "deploy_path=/var/www/ruizerwin.com" >> $GITHUB_OUTPUT
            echo "deploy_host=ruizerwin.com" >> $GITHUB_OUTPUT
            echo "env_example=.env.production.example" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=/var/www/staging" >> $GITHUB_OUTPUT
            echo "deploy_host=staging.ruizerwin.com" >> $GITHUB_OUTPUT
            echo "env_example=.env.staging.example" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Laravel app via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ steps.vars.outputs.deploy_path }}"
            DEPLOY_HOST="${{ steps.vars.outputs.deploy_host }}"
            ENV_EXAMPLE="${{ steps.vars.outputs.env_example }}"
            BRANCH="${{ github.ref_name }}"
            PUBLIC_PATH="${DEPLOY_PATH}/public"

            cd "${DEPLOY_PATH}"

            if [ ! -d .git ]; then
              echo "ERROR: ${DEPLOY_PATH} is not a git repository."
              exit 1
            fi

            if ! command -v php8.4 >/dev/null 2>&1; then
              echo "ERROR: php8.4 is required but was not found on PATH."
              exit 1
            fi

            if ! command -v composer >/dev/null 2>&1; then
              echo "ERROR: composer is required but was not found on PATH."
              exit 1
            fi

            echo "Fetching origin/${BRANCH}..."
            git fetch origin "${BRANCH}"

            # Keep / migrate Laravel .env only (not a site backup).
            if [ -f apps/web/.env ] && [ ! -f .env ]; then
              echo "Moving apps/web/.env -> .env"
              mv apps/web/.env .env
            fi

            git checkout "${BRANCH}"

            # Exact match to GitHub; discard leftover tracked junk from old PHP layout.
            git reset --hard "origin/${BRANCH}"

            # Delete ALL untracked/ignored leftovers except .env (no vendor/old PHP/apps leftovers).
            # vendor is reinstalled by Composer below.
            git clean -fdx -e .env

            if [ ! -f artisan ]; then
              echo "ERROR: Laravel artisan not found after sync."
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "WARNING: No .env found. Creating from ${ENV_EXAMPLE} (fill mail/reCAPTCHA on server)."
              cp "${ENV_EXAMPLE}" .env
              php8.4 artisan key:generate --force
            fi

            php8.4 -v
            COMPOSER_BIN="$(command -v composer)"
            php8.4 "${COMPOSER_BIN}" install --no-dev --optimize-autoloader --no-interaction

            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo find storage bootstrap/cache -type d -exec chmod 775 {} \;
            sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;
            sudo chmod 640 .env

            php8.4 artisan optimize:clear
            php8.4 artisan optimize

            # Point Apache at Laravel public/ for this host (fixes staging 404 after apps/web removal).
            if [ -d /etc/apache2/sites-enabled ]; then
              echo "Updating Apache DocumentRoot to ${PUBLIC_PATH} where this host is configured..."
              shopt -s nullglob
              for conf in /etc/apache2/sites-enabled/*.conf /etc/apache2/sites-available/*.conf; do
                if grep -Eq "ServerName[[:space:]]+${DEPLOY_HOST}|ServerAlias.*${DEPLOY_HOST}|DocumentRoot[[:space:]]+\"?${DEPLOY_PATH}" "${conf}"; then
                  echo "Patching ${conf}"
                  sudo sed -i -E "s#DocumentRoot[[:space:]]+[^[:space:]]+#DocumentRoot ${PUBLIC_PATH}#g" "${conf}"
                  sudo sed -i -E "s#(<Directory[[:space:]]+)\"?${DEPLOY_PATH}(/public)?\"?#\1\"${PUBLIC_PATH}\"#g" "${conf}"
                fi
              done
              shopt -u nullglob
              sudo apache2ctl configtest
              sudo systemctl reload apache2
            fi

      - name: Verify deployment over HTTPS
        run: |
          set -euo pipefail
          HOST="${{ steps.vars.outputs.deploy_host }}"
          echo "Checking https://${HOST}/ ..."
          curl -sSI "https://${HOST}/" | head -n 20
          curl -fsSI "https://${HOST}/" >/dev/null
