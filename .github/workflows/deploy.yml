name: Deploy Portfolio

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deployment target
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "deploy_path=/var/www/ruizerwin.com" >> $GITHUB_OUTPUT
            echo "deploy_host=ruizerwin.com" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=/var/www/staging" >> $GITHUB_OUTPUT
            echo "deploy_host=staging.ruizerwin.com" >> $GITHUB_OUTPUT
          fi

      - name: Deploy files via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            cd "${{ steps.vars.outputs.deploy_path }}"
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --no-interaction
            else
              echo "Warning: composer not found on server. Run 'composer install' manually."
            fi

      - name: Fix permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo chown -R ubuntu:www-data "${{ steps.vars.outputs.deploy_path }}"
            sudo find "${{ steps.vars.outputs.deploy_path }}" -type d -exec chmod 775 {} \;
            sudo find "${{ steps.vars.outputs.deploy_path }}" -type f -exec chmod 664 {} \;
            if [ -f "${{ steps.vars.outputs.deploy_path }}/.env" ]; then
              sudo chmod 640 "${{ steps.vars.outputs.deploy_path }}/.env"
            fi

      - name: Verify deployment
        run: |
          curl -I http://${{ steps.vars.outputs.deploy_host }}
